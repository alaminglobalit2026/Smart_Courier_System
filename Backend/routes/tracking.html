
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Courier Tracking</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f5fa;
    padding: 20px;
}
.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
input, button {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    box-sizing: border-box;
}
button {
    background: #1677e8;
    color: white;
    border: none;
    cursor: pointer;
}
#map {
    width: 100%;
    height: 350px;
    border: 0;
    margin-top: 15px;
}
</style>
</head>
<body>

<div class="container">
    <h2>Smart Courier System</h2>
    <h3>Customer Live Tracking</h3>

    <input id="trackingNumber"
        value="SC6671FAA5ED"
        placeholder="Tracking Number">

    <input id="receiverPhone"
        value="01012345678"
        placeholder="Receiver Phone">

    <button onclick="trackParcel()">Track Parcel</button>

    <p id="message"></p>
    <div id="details"></div>

    <iframe id="map"></iframe>
</div>

<script>
async function trackParcel() {
    const tracking = document.getElementById("trackingNumber").value.trim();
    const phone = document.getElementById("receiverPhone").value.trim();

    const message = document.getElementById("message");
    const details = document.getElementById("details");

    try {
        const url =
            "http://localhost:5000/api/parcels/live/" +
            encodeURIComponent(tracking) +
            "?receiverPhone=" + encodeURIComponent(phone);

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message);
        }

        details.innerHTML = "";

        const heading = document.createElement("h3");
        heading.textContent = "Tracking: " + data.trackingNumber;
        details.appendChild(heading);

        const status = document.createElement("p");
        status.textContent = "Status: " + data.status;
        details.appendChild(status);

        if (!data.locationSharingEnabled || !data.driverLocation) {
            message.textContent = "Driver GPS sharing is disabled.";
            document.getElementById("map").src = "about:blank";
            return;
        }

        const lat = data.driverLocation.latitude;
        const lng = data.driverLocation.longitude;

        document.getElementById("map").src =
            "https://www.google.com/maps?q=" +
            lat + "," + lng + "&output=embed";

        message.textContent = "Driver location loaded successfully!";

    } catch (error) {
        message.textContent = error.message || "Tracking failed.";
    }
}
</script>

</body>
</html>
