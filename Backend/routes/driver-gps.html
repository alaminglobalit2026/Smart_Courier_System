
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Courier - Driver GPS</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f1f5f9;
    color: #1e293b;
}

.container {
    max-width: 550px;
    margin: 20px auto;
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    color: #123456;
}

input, select, button {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    border-radius: 7px;
    font-size: 15px;
}

input, select {
    border: 1px solid #cbd5e1;
}

button {
    border: none;
    color: white;
    background: #1677e8;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#stopButton {
    background: #dc2626;
}

#message {
    padding: 12px;
    background: #f1f5f9;
    border-radius: 7px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.hidden {
    display: none;
}

.small {
    color: #64748b;
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h2>Smart Courier System</h2>
<h3>Driver GPS Dashboard</h3>

<div id="loginSection">
    <h3>Driver Login</h3>

    <input
        type="email"
        id="email"
        placeholder="Driver Email"
        value="driver1@smartcourier.com"
    >

    <input
        type="password"
        id="password"
        placeholder="Driver Password"
    >

    <button onclick="driverLogin()">Login</button>
</div>

<div id="dashboard" class="hidden">

    <h3 id="welcome"></h3>

    <label>Select Assigned Parcel</label>

    <select id="parcelSelect">
        <option value="">Loading parcels...</option>
    </select>

    <button id="startButton" onclick="startGPS()">
        Start GPS Sharing
    </button>

    <button id="stopButton" onclick="stopGPS()" disabled>
        Stop GPS Sharing
    </button>

    <p id="message">GPS is currently stopped.</p>

    <p class="small">
        Keep this page open while sharing location.
        Your phone may ask for location permission.
    </p>

    <button onclick="logout()" style="background:#475569">
        Logout
    </button>

</div>

</div>

<script>
const API_BASE = "http://localhost:5000";

let driverToken = null;
let watchId = null;
let selectedTrackingNumber = null;
let gpsStarting = false;
let gpsStopping = false;
let sendingLocation = false;

const message = document.getElementById("message");

async function apiRequest(path, method = "GET", body = null) {
    const options = {
        method,
        headers: {
            "Authorization": "Bearer " + driverToken
        }
    };

    if (body !== null) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
    }

    const response = await fetch(API_BASE + path, options);

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}

// DRIVER LOGIN
async function driverLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        message.textContent = "Logging in...";

        const response = await fetch(API_BASE + "/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Login failed.");
        }

        if (data.user.role !== "driver") {
            throw new Error("This account is not a Driver account.");
        }

        driverToken = data.token;

        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");

        document.getElementById("welcome").textContent =
            "Welcome, " + data.user.name;

        await loadParcels();

        message.textContent = "Driver login successful!";

    } catch (error) {
        message.textContent = error.message;
    }
}

// LOAD ASSIGNED PARCELS
async function loadParcels() {
    try {
        const data = await apiRequest("/api/driver/my-parcels");

        const select = document.getElementById("parcelSelect");
        select.innerHTML = "";

        const availableParcels = data.parcels.filter(
            parcel => !["delivered", "cancelled"].includes(parcel.status)
        );

        if (availableParcels.length === 0) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No active assigned parcels";
            select.appendChild(option);
            return;
        }

        availableParcels.forEach(parcel => {
            const option = document.createElement("option");

            option.value = parcel.trackingNumber;
            option.textContent =
                parcel.trackingNumber + " - " + parcel.status;

            select.appendChild(option);
        });

    } catch (error) {
        message.textContent = error.message;
    }
}

// START GPS SHARING
async function startGPS() {
    if (gpsStarting || watchId !== null) return;

    if (!navigator.geolocation) {
        message.textContent = "This browser does not support GPS.";
        return;
    }

    if (!window.isSecureContext) {
        message.textContent =
            "GPS requires HTTPS or localhost. Open this page securely.";
        return;
    }

    selectedTrackingNumber =
        document.getElementById("parcelSelect").value;

    if (!selectedTrackingNumber) {
        message.textContent = "Please select an assigned parcel.";
        return;
    }

    gpsStarting = true;
    document.getElementById("startButton").disabled = true;

    try {
        await apiRequest("/api/driver/location-sharing", "PUT", {
            trackingNumber: selectedTrackingNumber,
            enabled: true
        });

        message.textContent = "GPS sharing enabled. Waiting for phone location...";

        watchId = navigator.geolocation.watchPosition(
            sendLocation,
            gpsError,
            {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 20000
            }
        );

        document.getElementById("stopButton").disabled = false;

    } catch (error) {
        message.textContent = error.message;
        document.getElementById("startButton").disabled = false;
    } finally {
        gpsStarting = false;
    }
}

// SEND REAL PHONE GPS TO BACKEND
async function sendLocation(position) {
    if (sendingLocation || !selectedTrackingNumber || gpsStopping) {
        return;
    }

    sendingLocation = true;

    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;

    try {
        const data = await apiRequest(
            "/api/driver/update-location",
            "PUT",
            {
                trackingNumber: selectedTrackingNumber,
                latitude,
                longitude
            }
        );

        message.textContent =
            "GPS sharing active!\nLatitude: " + latitude +
            "\nLongitude: " + longitude +
            "\nUpdated: " + new Date().toLocaleTimeString();

    } catch (error) {
        message.textContent = error.message;
    } finally {
        sendingLocation = false;
    }
}

// GPS ERROR
async function gpsError(error) {
    const messages = {
        1: "Location permission denied. Please allow location access.",
        2: "Phone location is unavailable. Check GPS settings.",
        3: "GPS request timed out. Try again."
    };

    message.textContent = messages[error.code] || error.message;

    await stopGPS();
}

// STOP GPS SHARING
async function stopGPS() {
    if (gpsStopping) return;

    gpsStopping = true;

    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    document.getElementById("stopButton").disabled = true;

    try {
        if (driverToken && selectedTrackingNumber) {
            await apiRequest(
                "/api/driver/location-sharing",
                "PUT",
                {
                    trackingNumber: selectedTrackingNumber,
                    enabled: false
                }
            );
        }

        message.textContent = "GPS sharing stopped.";

    } catch (error) {
        message.textContent = error.message;
    } finally {
        gpsStopping = false;
        sendingLocation = false;
        selectedTrackingNumber = null;

        document.getElementById("startButton").disabled = false;
    }
}

// LOGOUT
async function logout() {
    if (watchId !== null || selectedTrackingNumber) {
        await stopGPS();
    }

    driverToken = null;

    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginSection").classList.remove("hidden");

    document.getElementById("password").value = "";

    message.textContent = "Logged out successfully.";
}
</script>

</body>
</html>
